name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: CLI smoke test
        shell: bash
        run: |
          node out/cli/pdf-studio-cli.cjs images build/icon.png --out icon.pdf
          node out/cli/pdf-studio-cli.cjs info icon.pdf
          node out/cli/pdf-studio-cli.cjs protect icon.pdf --password ci --out locked.pdf
          node out/cli/pdf-studio-cli.cjs info locked.pdf --password ci | grep '"encrypted": true'
